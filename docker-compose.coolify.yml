# E-Watu ERP — production stack for Coolify (Docker Compose build pack).
#
# In Coolify:
#   1. New Resource → Docker Compose → Git repository
#   2. Compose file path: docker-compose.coolify.yml
#   3. Set environment variables from deploy/coolify/env.example
#   4. Assign your domain to the "gateway" service (container port 80)
#
# See docs/COOLIFY.md for the full walkthrough.

name: ewatu-erp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ewatu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ewatu}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ewatu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      PORT: '3011'
      NODE_ENV: production
      SERVICE_NAME: identity-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-ewatu}:${POSTGRES_PASSWORD}@postgres:5432/identity_db
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${APP_URL:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      PLATFORM_SERVICE_URL: http://platform-service:3012
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      PORT: '3015'
      NODE_ENV: production
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-ewatu}:${POSTGRES_PASSWORD}@postgres:5432/notifications_db
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      CORS_ORIGIN: ${APP_URL:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-E-Watu}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ewatu.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  platform-service:
    build:
      context: .
      dockerfile: services/platform-service/Dockerfile
    environment:
      PORT: '3012'
      NODE_ENV: production
      SERVICE_NAME: platform-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-ewatu}:${POSTGRES_PASSWORD}@postgres:5432/platform_db
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      CORS_ORIGIN: ${APP_URL:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      IDENTITY_SERVICE_URL: http://identity-service:3011
      NOTIFICATION_SERVICE_URL: http://notification-service:3015
      WEB_APP_ORIGIN: ${APP_URL:?}
      ONBOARDING_DEV_HINTS: ${ONBOARDING_DEV_HINTS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  recruitment-service:
    build:
      context: .
      dockerfile: services/recruitment-service/Dockerfile
    environment:
      PORT: '3013'
      NODE_ENV: production
      SERVICE_NAME: recruitment-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-ewatu}:${POSTGRES_PASSWORD}@postgres:5432/recruitment_db
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      CORS_ORIGIN: ${APP_URL:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      PLATFORM_SERVICE_URL: http://platform-service:3012
    depends_on:
      postgres:
        condition: service_healthy
      platform-service:
        condition: service_started
    restart: unless-stopped

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    environment:
      PORT: '3018'
      NODE_ENV: production
      SERVICE_NAME: document-service
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      CORS_ORIGIN: ${APP_URL:?}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ewatu-prod}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ewatu}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      - minio
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile.prod
      args:
        VITE_API_URL: ${APP_URL:?}
    depends_on:
      - identity-service
      - platform-service
      - recruitment-service
      - document-service
      - notification-service
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
