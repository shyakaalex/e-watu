# Reference only — Coolify deploys each service separately (not this compose file).
# Documents required env vars and ports per service.
# See docs/COOLIFY.md for per-service Coolify setup.

version: '3.8'

services:
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - '3011:3011'
    environment:
      DATABASE_URL: ${IDENTITY_DATABASE_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      SERVICE_NAME: identity-service
      NODE_ENV: ${NODE_ENV}
      PORT: 3011
      BCRYPT_ROUNDS: 12
      JWT_EXPIRES_IN: 15m
      REFRESH_TTL_MS: 604800000
      CORS_ORIGIN: ${CORS_ORIGIN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PLATFORM_SERVICE_URL: ${PLATFORM_SERVICE_URL}

  platform-service:
    build:
      context: .
      dockerfile: services/platform-service/Dockerfile
    ports:
      - '3012:3012'
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      SERVICE_NAME: platform-service
      NODE_ENV: ${NODE_ENV}
      PORT: 3012
      CORS_ORIGIN: ${CORS_ORIGIN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN}
      ONBOARDING_DEV_HINTS: ${ONBOARDING_DEV_HINTS:-false}

  recruitment-service:
    build:
      context: .
      dockerfile: services/recruitment-service/Dockerfile
    ports:
      - '3013:3013'
    environment:
      DATABASE_URL: ${RECRUITMENT_DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      SERVICE_NAME: recruitment-service
      NODE_ENV: ${NODE_ENV}
      PORT: 3013
      CORS_ORIGIN: ${CORS_ORIGIN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PLATFORM_SERVICE_URL: ${PLATFORM_SERVICE_URL}

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - '3015:3015'
    environment:
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      SERVICE_NAME: notification-service
      NODE_ENV: ${NODE_ENV}
      PORT: 3015
      CORS_ORIGIN: ${CORS_ORIGIN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      EMAIL_FROM: ${EMAIL_FROM}

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    ports:
      - '3018:3018'
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      SERVICE_NAME: document-service
      NODE_ENV: ${NODE_ENV}
      PORT: 3018
      CORS_ORIGIN: ${CORS_ORIGIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - '80:80'
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-identity-service:3011}
      PLATFORM_SERVICE_URL: ${PLATFORM_SERVICE_URL:-platform-service:3012}
      RECRUITMENT_SERVICE_URL: ${RECRUITMENT_SERVICE_URL:-recruitment-service:3013}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-notification-service:3015}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-document-service:3018}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - '80:80'
