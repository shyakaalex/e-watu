worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  log_format main '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  upstream identity_service {
    server identity-service:3011;
  }

  upstream platform_service {
    server platform-service:3012;
  }

  upstream recruitment_service {
    server recruitment-service:3013;
  }

  upstream payroll_service {
    server payroll-service:3016;
  }

  upstream document_service {
    server document-service:3018;
  }

  upstream notification_service {
    server notification-service:3015;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"e-watu-gateway"}';
    }

    location /api/v1/auth {
      proxy_pass http://identity_service;
    }

    location /api/v1/me {
      proxy_pass http://identity_service;
    }

    location /api/v1/users {
      proxy_pass http://identity_service;
    }

    location /api/v1/identity {
      proxy_pass http://identity_service;
    }

    location /api/v1/internal/dispatch {
      proxy_pass http://notification_service;
    }

    location /api/v1/internal/tenants {
      proxy_pass http://platform_service;
    }

    location /api/v1/internal/provision-tenant-owner {
      proxy_pass http://identity_service;
    }

    location /api/v1/internal {
      proxy_pass http://identity_service;
    }

    location /api/v1/platform {
      proxy_pass http://platform_service;
    }

    location /api/v1/tenants {
      proxy_pass http://platform_service;
    }

    location /api/v1/onboarding {
      proxy_pass http://platform_service;
    }

    location /api/v1/my {
      proxy_pass http://platform_service;
    }

    location /api/v1/public/tenants {
      proxy_pass http://platform_service;
    }

    location /api/v1/jobs {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/candidates {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/applications {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/interviews {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/offers {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/placements {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/public/ {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/recruitment {
      proxy_pass http://recruitment_service;
    }

    location /api/v1/payroll {
      proxy_pass http://payroll_service;
    }

    location /api/v1/employees {
      proxy_pass http://payroll_service;
    }

    location /api/v1/outsourcing {
      proxy_pass http://payroll_service;
    }

    location /api/v1/hr {
      proxy_pass http://payroll_service;
    }

    location /api/v1/document {
      proxy_pass http://document_service;
    }

    location /api/v1/notifications {
      proxy_pass http://notification_service;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
